<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search GIPHY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="page-header">
        <nav class="navbar navbar-expand-md fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand logo" href="./index.html">SearchGIPHY</a>
            <!--<nav class="page-header-menu-container page-header-menu-container--regular"></nav>-->
            <button class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#headerNavigation" 
                aria-controls="headerNavigation" 
                aria-expanded="false" 
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="headerNavigation">
                <ul class="navbar-nav mx-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#top">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#results">Results</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <main>
        <div class="search-area" id="search">
            <form action="#" method="get" class="js-search-form">
                <input type="text" name="search-name" placeholder="Search e.g.: funny cat hat">
                <button type="submit">Search</button>
            </form>
        </div>
        <div class="search-param-container js-search-param-container" id="searchParam"></div>
        <hr>
        <div class="results-container js-results-container" id="results"></div>
        <hr>
        <div id="about">
            <p>This webpage searches the GIPHY website based on the user's input</p>
            <p>By right-clicking on a GIF, you can do the following:</p>
            <ul>
                <li>Open GIF in a new tab</li>
                <li>Copy the GIF</li>
                <li>Copy the GIF address</li>
                <li>Save the GIF</li>
                <li>Create a QR code for the GIF</li>
            </ul>
        </div>
    </main>
    <script src="./js/main.js"></script>
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"
    ></script>
</body>
</html>
