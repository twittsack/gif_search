<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search GIPHY</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <h2>Search GIPHY</h2>

    <div class="search-area">
        <form action="#" method="get" class="js-search-form">
        <label>
            <p>Enter descriptive word(s) to search:</p>
            <pre>Example: funny cat or funny+cat for multi-word searches</pre>
            <input type="text" name="search-name" />
        </label>
        <button type="submit">Search</button>
    </form>
    </div>
    <div id="searchParam" class="search-param-container js-search-param-container"></div>
    <hr>

    <div id="results" class="results-container js-results-container"></div>
    <script src="./js/main.js"></script>
    
</body>
</html>
